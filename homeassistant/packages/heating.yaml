# Heating: tunables, handover stage and outputs for the Node-RED heating flows.
#
# No `initial:` values on purpose: HA then restores the last value after a restart,
# so learned values survive. Starting values are set once with the
# "Set starting values" button on the Node-RED 40 tab.

input_boolean:
  heating_holiday_home:
    name: Heating holiday at home
    icon: mdi:sofa
    # On: every day is a Home day (phone alarms ignored), e.g. over Christmas. A "Heating"
    # calendar event still overrides a single date.
  heating_away:
    name: Heating away
    icon: mdi:airplane
    # On: hold heating_away_temp; warm up for heating_away_return, then switches itself off.
  heating_optimum_start:
    name: Heating optimum start
    icon: mdi:clock-start
    # On: each heating period starts just early enough to be warm by its time (learned warm-up
    # rate, at most heating_preheat_max early). Off: fixed preheat before the alarm.
  heating_season:
    name: Heating season
    icon: mdi:snowflake-thermometer
    # Off = summer: no heat demand (the comfort button still works), and the Shelly
    # failsafe keeps the relay off. Created off: switch it on for winter.
  heating_live:
    name: Heating live control
    icon: mdi:radiator
    # off = dry-run: everything is calculated and logged, nothing is switched or written
  heating_comfort_event_today:
    name: Heating comfort event today
    icon: mdi:snowflake-alert
  # Mirrors written by Node-RED
  heating_demand:
    name: Heating demand (controller)
    icon: mdi:fire
  heating_period:
    name: Heating period active
    icon: mdi:calendar-clock
  heating_flame:
    name: Boiler flame
    icon: mdi:fire-circle

input_select:
  heating_stage:
    name: Heating stage
    icon: mdi:stairs
    options:
      - "0 Shadow"
      - "1 Capped"
      - "2 Assisted"
      - "3 Auto"
  # Day type per weekday. Work: a morning from the phone alarms, then the evening. Home: one
  # daytime period. Out: the evening only. A "Heating" calendar event for a date overrides it
  # (sensor.heating_calendar_days), and holiday at home makes every day a Home day.
  heating_day_mon: &day_type
    name: Heating Monday
    icon: mdi:calendar-week
    options: [Work, Home, Out]
  heating_day_tue:
    <<: *day_type
    name: Heating Tuesday
  heating_day_wed:
    <<: *day_type
    name: Heating Wednesday
  heating_day_thu:
    <<: *day_type
    name: Heating Thursday
  heating_day_fri:
    <<: *day_type
    name: Heating Friday
  heating_day_sat:
    <<: *day_type
    name: Heating Saturday
  heating_day_sun:
    <<: *day_type
    name: Heating Sunday

input_number:
  # --- Tunables (learning adjusts slope, offset and floor) ---
  heating_slope:
    name: Heating curve slope
    min: 0.8
    max: 2.5
    step: 0.05
    mode: box
  heating_offset:
    name: Heating curve offset
    min: -10
    max: 15
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
  heating_kp:
    name: Heating Kp
    min: 0
    max: 10
    step: 0.1
    mode: box
  heating_ki:
    name: Heating Ki (per min)
    min: 0
    max: 0.2
    step: 0.005
    mode: box
  heating_stage_floor:
    name: Heating stage floor
    min: 25
    max: 60
    step: 1
    unit_of_measurement: "°C"
    mode: box
  # Temperature of each period of the day types
  heating_work_morning_temp: &period_temp
    name: Heating Work morning
    min: 15
    max: 23
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
  heating_work_evening_temp:
    <<: *period_temp
    name: Heating Work evening
  heating_home_temp:
    <<: *period_temp
    name: Heating Home day
  heating_out_temp:
    <<: *period_temp
    name: Heating Out evening
  heating_setpoint_night:
    name: Heating setpoint night
    min: 10
    max: 20
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
  heating_preheat_minutes:
    name: Heating preheat before alarm
    min: 0
    max: 180
    step: 5
    unit_of_measurement: min
    mode: box
  heating_preheat_max:
    name: Heating optimum start max prestart
    min: 15
    max: 240
    step: 5
    unit_of_measurement: min
    mode: box
  heating_away_temp:
    name: Heating away temperature
    min: 7
    max: 18
    step: 0.5
    unit_of_measurement: °C
    mode: box
  heating_alarm_hold_minutes:
    name: Heating on after alarm
    min: 0
    max: 180
    step: 5
    unit_of_measurement: min
    mode: box
  heating_boost_minutes:
    name: Heating warm-up boost
    min: 0
    max: 90
    step: 5
    unit_of_measurement: min
    mode: box

  # --- Outputs written by Node-RED (for the dashboard and history) ---
  heating_flow_target:
    name: Heating flow target
    min: 20
    max: 60
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
  heating_flow_curve:
    name: Heating flow curve (unclamped)
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
  heating_integral:
    name: Heating integral
    min: -5
    max: 5
    step: 0.01
    unit_of_measurement: "°C"
    mode: box
  heating_good_days:
    name: Heating good days
    min: 0
    max: 60
    step: 1
    unit_of_measurement: days
    mode: box
  heating_setpoint:
    name: Heating setpoint now
    min: 5
    max: 25
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
  heating_boiler_modulation:
    name: Boiler modulation
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: box
  heating_burner_minutes_today:
    name: Burner minutes today
    min: 0
    max: 1440
    step: 1
    unit_of_measurement: min
    mode: box

input_datetime:
  heating_away_return:
    name: Heating away return
    has_date: true
    has_time: true
  # Times of the day types (the Work morning comes from the phone alarms)
  heating_work_evening_start: &period_time
    name: Heating Work evening from
    has_date: false
    has_time: true
  heating_work_end:
    <<: *period_time
    name: Heating Work off at
  heating_home_start:
    <<: *period_time
    name: Heating Home from
  heating_home_end:
    <<: *period_time
    name: Heating Home off at
  heating_out_start:
    <<: *period_time
    name: Heating Out from
  heating_out_end:
    <<: *period_time
    name: Heating Out off at

input_text:
  heating_status:
    name: Heating status
    max: 255
  heating_last_decision:
    name: Heating last decision
    max: 255
  heating_failsafe_mode:
    name: Shelly failsafe mode
    max: 32
  heating_next:
    name: Heating next block
    max: 128
  heating_warmup:
    name: Heating warm-up rates
    max: 255

input_button:
  heating_comfort_mode:
    name: Heating comfort mode (4 h at 60 °C)
    icon: mdi:fire-alert
  heating_approve_promotion:
    name: Heating approve promotion
    icon: mdi:check-decagram

timer:
  heating_comfort_mode:
    name: Heating comfort mode
    duration: "04:00:00"
    restore: true

# The Shelly failsafe posts its mode to this webhook on every change (and retries), so HA
# hears it even when Node-RED is down. Node-RED also mirrors it from MQTT; whichever comes
# first sets the text, and the second automation notifies once per change.
# Day-type overrides from the "Heating" calendar, for today and the next two days. An event whose
# title starts with Work, Home, Out or Off (any case) sets the day type of every date it covers;
# the first one wins. Node-RED reads the `days` attribute ({"2026-12-24": "Home", ...}). The state
# says whether the calendar was found, so a missing calendar shows up instead of failing silently.
template:
  - triggers:
      - trigger: time_pattern
        minutes: /15
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - variables:
          cal_id: calendar.heating
      - action: calendar.get_events
        target:
          entity_id: "{{ cal_id }}"
        data:
          start_date_time: "{{ today_at().isoformat() }}"
          duration:
            days: 3
        response_variable: cal
        continue_on_error: true
    sensor:
      - name: Heating calendar days
        unique_id: heating_calendar_days
        icon: mdi:calendar-star
        state: "{{ 'ok' if cal is defined and cal_id in cal else 'no calendar' }}"
        attributes:
          days: >-
            {% set evs = cal[cal_id].events if cal is defined and cal_id in cal else [] %}
            {% set ns = namespace(d={}) %}
            {% for i in range(3) %}
              {% set day = (today_at() + timedelta(days=i)).date().isoformat() %}
              {% for e in evs | sort(attribute='start') %}
                {% if 'T' in e.start %}
                  {% set hit = as_local(as_datetime(e.start)).date().isoformat() <= day
                     <= as_local(as_datetime(e.end) - timedelta(seconds=1)).date().isoformat() %}
                {% else %}
                  {% set hit = e.start <= day < e.end %}
                {% endif %}
                {% set word = ((e.summary | default('')).split(' ') | first | lower).strip(':,.-') %}
                {% if hit and day not in ns.d and word in ['work', 'home', 'out', 'off'] %}
                  {% set ns.d = dict(ns.d, **{day: word | capitalize}) %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ ns.d }}

automation:
  - id: heating_failsafe_mode_webhook
    alias: "Heating: Shelly failsafe mode (webhook)"
    mode: queued
    triggers:
      - trigger: webhook
        webhook_id: !secret heating_failsafe_webhook
        allowed_methods: [POST]
        local_only: true
    conditions:
      - condition: template
        value_template: "{{ trigger.json is defined and trigger.json.mode in ['ha', 'local', 'timed', 'warm'] }}"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.heating_failsafe_mode
        data:
          value: "{{ trigger.json.mode }}"

  - id: heating_failsafe_mode_notify
    alias: "Heating: Shelly failsafe mode changed"
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_text.heating_failsafe_mode
        not_from: ["unknown", "unavailable", ""]
        not_to: ["unknown", "unavailable", ""]
    variables:
      text: >-
        {{ 'Shelly failsafe: HA is back in control.' if trigger.to_state.state == 'ha'
           else 'Shelly failsafe active (' ~ trigger.to_state.state ~ '): the Shelly is running the heating on its own.' }}
    actions:
      - action: logbook.log
        data:
          name: Heating
          message: "{{ text }}"
          entity_id: input_text.heating_failsafe_mode
      - action: notify.<NOTIFY_SERVICE>
        data:
          title: Heating
          message: "{{ text }}"
